<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LigaPádel — Inicio</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lp-logo { display:flex; align-items:center; gap:8px; }
    .lp-logo-txt { font-size:18px; font-weight:900; color:var(--texto); }
    .lp-logo-txt span { color:var(--azul); }

    .liga-estado { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:10px; font-weight:800; }
    .le-borrador   { background:#f1f5f9; color:#64748b; }
    .le-inscripcion{ background:#dbeafe; color:#1e40af; }
    .le-activa     { background:#dcfce7; color:#15803d; }
    .le-fase_final { background:#fef9c3; color:#92400e; }
    .le-finalizada { background:#f1f5f9; color:#64748b; }

    .alerta-card { border-radius:12px; padding:10px 13px; margin-bottom:7px; cursor:pointer; border-left:3px solid; }
    .alerta-r { border-color:var(--rojo); background:#fff5f5; }
    .alerta-a { border-color:var(--naranja); background:#fffbeb; }
    .alerta-b { border-color:var(--azul); background:#eff6ff; }
    .alerta-titulo { font-size:12px; font-weight:800; }
    .alerta-sub    { font-size:10px; font-weight:600; color:var(--sutil); margin-top:2px; }

    .cat-chip { display:inline-flex; padding:2px 8px; border-radius:100px; font-size:10px; font-weight:800; }
    .cat-m { background:#eff6ff; color:#1e40af; }
    .cat-f { background:#f3e8ff; color:#6d28d9; }
    .cat-x { background:#f0fdf4; color:#15803d; }
    .cat-b { background:#fef9c3; color:#92400e; }

    .fmt-chip { display:inline-flex; padding:2px 8px; border-radius:100px; font-size:10px; font-weight:700; background:#f1f5f9; color:#64748b; }
  </style>
</head>
<body>
<div class="page">

  <div id="header-container"></div>
  <nav id="nav-container"></nav>

  <main class="content">

    <!-- Sección header -->
    <div class="sec">
      <div class="lp-logo">
        <img src="icons/ligas.png" style="width:36px;height:36px;object-fit:contain">
        <div>
          <div class="lp-logo-txt">Liga<span>Pádel</span></div>
          <div style="font-size:10px;font-weight:600;color:var(--sutil)" id="org-nombre">Cargando...</div>
        </div>
      </div>
      <div class="sec-count" id="contador">—</div>
    </div>

    <!-- KPIs -->
    <div class="kpi-row" id="kpi-row"></div>

    <!-- Alertas -->
    <div id="alertas-wrap"></div>

    <!-- Ligas activas -->
    <div id="ligas-activas-wrap"></div>

    <!-- Ligas finalizadas -->
    <div id="ligas-finalizadas-wrap"></div>

  </main>

  <button class="fab" onclick="window.location.href='nueva-liga.html'">+</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/store-liga.js"></script>
<script src="js/ui.js"></script>
<script>

let _ligas = [];
let _org   = null;

// ── KPIs ─────────────────────────────────────────────────────
function renderKPIs() {
  const activas   = _ligas.filter(l => ['inscripcion','activa','fase_final'].includes(l.estado));
  const jugadores = _ligas.reduce((s, l) => s + (l.lp_parejas?.[0]?.count || 0) * 2, 0);
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi azul"><div class="val">${activas.length}</div><div class="lbl">Ligas activas</div></div>
    <div class="kpi verde"><div class="val">${_ligas.length}</div><div class="lbl">Total ligas</div></div>
    <div class="kpi azul"><div class="val">${jugadores}</div><div class="lbl">Jugadores aprox.</div></div>`;
  document.getElementById('contador').textContent = activas.length;
}

// ── Alertas ────────────────────────────────────────────────────
async function renderAlertas() {
  const wrap = document.getElementById('alertas-wrap');
  // Buscar ligas activas con partidos pendientes
  const activas = _ligas.filter(l => l.estado === 'activa');
  if (!activas.length) { wrap.innerHTML = ''; return; }

  let html = `<div style="font-size:10px;font-weight:900;color:var(--sutil);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">Acciones pendientes</div>`;

  for (const liga of activas.slice(0, 3)) {
    const { data: pendientes } = await _sb.from('lp_partidos')
      .select('id', { count: 'exact' })
      .eq('liga_id', liga.id)
      .eq('estado', 'pendiente');
    const n = pendientes?.length || 0;
    if (n > 0) {
      html += `<div class="alerta-card alerta-r" onclick="window.location.href='liga.html?id=${liga.id}&tab=resultados'">
        <div class="alerta-titulo" style="color:var(--rojo)">${n} resultado${n>1?'s':''} sin anotar</div>
        <div class="alerta-sub">${liga.nombre}</div>
      </div>`;
    }
  }
  wrap.innerHTML = html;
}

// ── Render lista ───────────────────────────────────────────────
function renderLigas() {
  const activas    = _ligas.filter(l => l.estado !== 'finalizada' && l.estado !== 'borrador');
  const borrador   = _ligas.filter(l => l.estado === 'borrador');
  const finalizadas= _ligas.filter(l => l.estado === 'finalizada');

  let html = '';

  if (activas.length || borrador.length) {
    html += `<div style="font-size:10px;font-weight:900;color:var(--sutil);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">En curso</div>`;
    [...activas, ...borrador].forEach(l => { html += cardLiga(l); });
  }

  if (finalizadas.length) {
    html += `<div style="font-size:10px;font-weight:900;color:var(--sutil);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px">Finalizadas</div>`;
    finalizadas.forEach(l => { html += cardLiga(l); });
  }

  if (!_ligas.length) {
    html = `<div class="loading" style="flex-direction:column;gap:12px;padding:40px 16px">
      <div style="font-size:32px">🏆</div>
      <div style="font-size:14px;font-weight:800;color:var(--texto)">Crea tu primera liga</div>
      <div style="font-size:12px;font-weight:600;color:var(--sutil);text-align:center">Pulsa el botón + para empezar</div>
    </div>`;
  }

  document.getElementById('ligas-activas-wrap').innerHTML = html;
  document.getElementById('ligas-finalizadas-wrap').innerHTML = '';
}

function cardLiga(l) {
  const nParejas = l.lp_parejas?.[0]?.count || 0;
  const nDivs    = l.lp_divisiones?.[0]?.count || 0;
  const catColor = { Masculina:'cat-m', Femenina:'cat-f', Mixta:'cat-x', Benjamín:'cat-b', Alevín:'cat-b', Infantil:'cat-b', Cadete:'cat-b', 'Júnior':'cat-b' };
  const catCls   = catColor[l.categoria] || 'cat-m';
  const fmtLabel = l.formato === 'americano' ? '🔄 Americano' : '🔁 Round-Robin';

  return `<div class="card" onclick="window.location.href='liga.html?id=${l.id}'">
    <div class="card-main">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:40px">
        <div class="av sq" style="background:${l.formato==='americano'?'#fffbeb':'#eff6ff'};color:${l.formato==='americano'?'#92400e':'#1e40af'};width:38px;height:38px;font-size:14px">
          ${l.formato === 'americano' ? '🔄' : '🏆'}
        </div>
      </div>
      <div class="ci">
        <div class="cn">${l.nombre}</div>
        <div class="cm" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px">
          <span class="cat-chip ${catCls}">${l.categoria || 'Sin categoría'}</span>
          <span class="fmt-chip">${fmtLabel}</span>
        </div>
        <div class="cm" style="margin-top:3px;font-size:10px;color:var(--sutil)">
          ${nDivs} división${nDivs!==1?'es':''} · ${nParejas} pareja${nParejas!==1?'s':''}
          ${l.temporada ? ' · '+l.temporada : ''}
        </div>
      </div>
      <span class="liga-estado le-${l.estado}">${estadoLabel(l.estado)}</span>
    </div>
  </div>`;
}

function estadoLabel(e) {
  const m = { borrador:'Borrador', inscripcion:'Inscripción', activa:'Activa', fase_final:'Fase final', finalizada:'Finalizada' };
  return m[e] || e;
}

// ── Init ───────────────────────────────────────────────────────
async function init() {
  renderHeader({ titulo:'LigaPádel', subtitulo:'Gestión de ligas', icono:'icons/ligas.png', botonDerecho:null });
  renderNav('ligas');
  await lpInit();

  _org = await lpGetOrganizador();
  document.getElementById('org-nombre').textContent = _org.nombre;

  showLoading('ligas-activas-wrap');
  _ligas = await lpGetLigas();
  renderKPIs();
  renderLigas();
  await renderAlertas();
}

init();
</script>
</body>
</html>
